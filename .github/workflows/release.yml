name: Release

# Every push to main is analysed for Conventional Commits (feat: → minor, fix:/perf: → patch,
# "!"/BREAKING CHANGE → minor while 0.x; other types and free-form messages → nothing). When it
# warrants a release, python-semantic-release tags the pushed commit vX.Y.Z and publishes a
# GitHub Release (no bump commit: the version lives in the tag only); the image is then built as
# ghcr.io/damhau/housegen:X.Y.Z (+ X.Y, sha-<short>, latest). A push that warrants no release
# builds sha-<short> (+ latest), as before. Either way the build is rolled out to the dev
# environment (deploy.yml); prod is a manual step (deploy-prod.yml).
#
# The build lives here and not in a tag-triggered workflow because a tag pushed with GITHUB_TOKEN
# triggers no other workflow (GitHub's guard against recursion).
on:
  push:
    branches: ["main"]
  # Run from another branch: only publishes a sha-<short> image (no release, no rollout).
  workflow_dispatch:

# One run at a time per branch: two quick pushes must not both analyse the history and tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: commit analysis starts from the previous tag

      - uses: astral-sh/setup-uv@v10.1.0 # no floating v10 tag: pin the release

      # Configured in backend/pyproject.toml, [tool.semantic_release]. Run as a CLI on the
      # runner: the official action is a Docker action whose container GitHub rebuilds on every
      # run (about a minute). --no-commit: no file is bumped, the tag goes on the pushed commit.
      # --no-changelog: the notes go on the GitHub Release, no CHANGELOG.md in the repo.
      # --strict: exit 2 when no release is due (any other non-zero code is a real failure).
      # The tag needs a tagger identity (annotated tag), hence the git config.
      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rc=0
          uvx --from python-semantic-release==10.6.2 \
            semantic-release -c backend/pyproject.toml --strict version --no-commit --no-changelog || rc=$?
          if [[ $rc -eq 2 ]]; then
            echo "No release: nothing release-worthy since $(git describe --tags --abbrev=0)"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ $rc -ne 0 ]]; then
            exit $rc
          fi
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          echo "Released ${tag}"
          {
            echo "released=true"
            echo "tag=${tag}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # also after a skipped release (workflow_dispatch), never after a failed one
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The one version string: image tag, GitOps rollout and what the app displays.
      #   released → 1.2.3      otherwise → sha-<7 chars of the commit>
      - name: Version
        id: version
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "short=${commit::7}" >> "$GITHUB_OUTPUT"
          if [[ "${{ needs.release.outputs.released }}" == "true" ]]; then
            echo "version=${{ needs.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${commit::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # every build: sha-<7 chars> of the commit; a release adds 1.2.3 and 1.2;
          # latest only follows main
          tags: |
            type=raw,value=sha-${{ steps.version.outputs.short }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.released == 'true' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ steps.version.outputs.commit }}
            SKETCHFAB=${{ secrets.SKETCHFAB_TOKEN != '' && 'on' || 'off' }}
          # Sketchfab (CC BY) furniture models; without the repository secret the build uses the
          # kit's parametric pieces instead
          secrets: |
            sketchfab_token=${{ secrets.SKETCHFAB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Roll the build out to dev: Argo CD syncs base/applications/housegen-dev from the GitOps repo.
  deploy-dev:
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      app: housegen-dev
      env: dev
      tag: ${{ needs.build.outputs.version }}
    secrets: inherit
