<!doctype html>
<html><head><meta charset="utf-8" />
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/kit/vendor/three/build/three.module.js",
  "three/addons/": "/kit/vendor/three/examples/jsm/",
  "housekit": "/kit/house.js",
  "housekit/interior": "/kit/interior.js"
} }
</script></head>
<body>
<script type="module">
// Floor-plan section of the scene: an orthographic camera straight down, the model cut at
// `cut` metres, the cut solids filled by a stencil pass (inside = more back faces than front
// faces below the cut). Exterior walls blue, partitions red, door leaves green.
import * as THREE from "three";
import house from "housekit";
import { buildScene } from "./src/scene.js";
const p = new URLSearchParams(location.search);
const ppm = Number(p.get("ppm") ?? 58.82);
const [x0, z0, x1, z1] = (p.get("box") ?? "-6,-5.5,6,5.5").split(",").map(Number);
const cut = Number(p.get("cut") ?? 1.35);
const W = Math.round((x1 - x0) * ppm), H = Math.round((z1 - z0) * ppm);
const renderer = new THREE.WebGLRenderer({ antialias: false, stencil: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.localClippingEnabled = true;
renderer.setClearColor(0xffffff, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const group = new THREE.Group(); scene.add(group);
const camera = new THREE.OrthographicCamera(x0, x1, -z0, -z1, 0.1, 200);
camera.up.set(0, 0, -1); camera.position.set(0, 100, 0); camera.lookAt(0, 0, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1)); const sun = new THREE.DirectionalLight();
await buildScene({ THREE, scene: new THREE.Scene(), house, group, sun, ground, renderer, camera });
group.updateMatrixWorld(true);

const CATS = { wall: 0x0000ff, perimeter: 0x0000ff, partition: 0xff0000, interiorDoor: 0x00c000 };
const SKIP = new Set(["window", "door"]);
function category(o) { for (let a = o; a; a = a.parent) { const k = a.userData?.kind; if (k) return SKIP.has(k) ? null : (k in CATS ? k : null); } return null; }
const clip = [new THREE.Plane(new THREE.Vector3(0, -1, 0), cut)];
const out = new THREE.Scene();
let order = 0;
const colors = [...new Set(Object.values(CATS))];
for (const color of colors) {
  const meshes = [];
  group.traverse((o) => { if (o.isMesh && category(o) && CATS[category(o)] === color) meshes.push(o); });
  for (const [side, op] of [[THREE.BackSide, THREE.IncrementWrapStencilOp], [THREE.FrontSide, THREE.DecrementWrapStencilOp]]) {
    const m = new THREE.MeshBasicMaterial({ side, colorWrite: false, depthWrite: false, depthTest: false, clippingPlanes: clip,
      stencilWrite: true, stencilFunc: THREE.AlwaysStencilFunc, stencilFail: op, stencilZFail: op, stencilZPass: op });
    for (const o of meshes) { const c = new THREE.Mesh(o.geometry, m); c.matrixAutoUpdate = false; c.matrix.copy(o.matrixWorld); c.renderOrder = order; out.add(c); }
  }
  const cap = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshBasicMaterial({ color, depthTest: false, depthWrite: false,
    stencilWrite: true, stencilRef: 0, stencilFunc: THREE.NotEqualStencilFunc, stencilFail: THREE.ReplaceStencilOp, stencilZFail: THREE.ReplaceStencilOp, stencilZPass: THREE.ReplaceStencilOp }));
  cap.rotation.x = -Math.PI / 2; cap.position.y = cut; cap.renderOrder = order + 1; out.add(cap);
  order += 2;
}
renderer.render(out, camera);
const rooms = [], partitions = [];
group.traverse((o) => { if (o.userData?.kind === "floorPlan") { rooms.push(...o.userData.rooms); partitions.push(...o.userData.partitions); } });
window.__plan = { ready: true, W, H, rooms, partitions };
</script></body></html>
