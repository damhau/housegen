# Single-replica deployment of the all-in-one image (API + UI + headless Chromium).
# Jobs run in-process and state lives in SQLite on the PVC: keep replicas: 1 until a
# job queue + shared storage exist.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: housegen-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Secret
metadata: { name: housegen-llm }
type: Opaque
stringData:
  LLM_PROVIDER: openai
  OPENAI_API_KEY: "replace-me"
  ANTHROPIC_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: housegen }
spec:
  replicas: 1
  strategy: { type: Recreate }        # one writer on the PVC
  selector: { matchLabels: { app: housegen } }
  template:
    metadata: { labels: { app: housegen } }
    spec:
      containers:
        - name: housegen
          image: ghcr.io/damhau/housegen:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: housegen-llm } }]
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 6Gi }   # software WebGL + image-heavy LLM calls: give it room
          # a deploy does not wait for a running job (up to 40 min): the job is marked
          # interrupted and the new pod resumes it with the same id (#7); the short sleep
          # only lets in-flight HTTP responses finish before SIGTERM
          lifecycle:
            preStop: { exec: { command: ["sleep", "5"] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: dshm, mountPath: /dev/shm }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: housegen-data }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: housegen }
spec:
  selector: { app: housegen }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: housegen
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 500m      # plan PDF + dozens of photos
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # SSE job stream
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: housegen.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: housegen, port: { number: 80 } } }
