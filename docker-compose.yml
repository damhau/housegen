services:
  housegen:
    build: .
    image: ghcr.io/damhau/housegen:latest
    env_file: backend/.env          # LLM_PROVIDER + API key; the image sets the rest
    volumes:
      - housegen-data:/data
    shm_size: 1gb                   # Chromium; on k8s use an emptyDir (medium: Memory) at /dev/shm
    ports: ["8000:8000"]            # UI + API on the same port

volumes:
  housegen-data:
