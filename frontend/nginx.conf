# BACKEND_HOST is the k8s Service / compose service name of the backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;   # plan PDFs + photos

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;         # required for the SSE job stream
        proxy_read_timeout 3600s;
    }
    location /scenes/ { proxy_pass http://backend:8000; }
    location /kit/    { proxy_pass http://backend:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
