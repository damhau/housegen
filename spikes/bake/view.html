<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Baked storey</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #000; } canvas { display: block; width: 100%; height: 100%; }</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// #42 bake spike: a storey drawn with its baked lightmap alone (no lights, no occlusion, no captures).
// ?glb=&lm=&at=x,z&yaw=&floor=&flip=0|1&exposure= (else set so the frame's median lands near 185)
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EXRLoader } from "three/addons/loaders/EXRLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#dfe6ea");
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; // reflections only (diffuse comes from the bake)
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 500);
const [gltf, lm] = await Promise.all([new GLTFLoader().loadAsync(q.get("glb")), new EXRLoader().loadAsync(q.get("lm"))]);
lm.channel = 1;
lm.flipY = q.get("flip") === "1";
lm.colorSpace = THREE.LinearSRGBColorSpace;
lm.needsUpdate = true;
let meshes = 0;
gltf.scene.traverse((o) => {
  if (!o.isMesh) return;
  meshes++;
  for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
    m.lightMap = lm;
    m.lightMapIntensity = Math.PI; // Cycles' diffuse light times the albedo is the radiance; three divides by pi
    m.envMapIntensity = 0.25;
  }
});
scene.add(gltf.scene);
const [x, z] = q.get("at").split(",").map(Number);
camera.position.set(x, Number(q.get("floor") ?? 0) + 1.45, z);
camera.rotation.set(0, Number(q.get("yaw")), 0, "YXZ");
const median = () => {
  const w = canvas.width, h = canvas.height, gl = renderer.getContext(), px = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const L = [];
  for (let i = 0; i < px.length; i += 64) L.push(0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]);
  L.sort((a, b) => a - b);
  return L[L.length >> 1];
};
let exposure = Number(q.get("exposure") ?? 1);
renderer.toneMappingExposure = exposure;
renderer.render(scene, camera);
if (!q.get("exposure")) {
  for (let k = 0; k < 8; k++) {
    const m = median();
    if (Math.abs(m - 185) < 4) break;
    exposure *= m < 20 ? 4 : Math.pow(185 / Math.max(m, 1), 1.6);
    renderer.toneMappingExposure = exposure;
    renderer.render(scene, camera);
  }
}
const dbg = renderer.getContext().getExtension("WEBGL_debug_renderer_info");
const gl = dbg ? renderer.getContext().getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "?";
window.__baked = { meshes, exposure, median: median(), gl };

// ?free=1: look around by hand (drag to turn on the spot, wheel to step forward and back, right-drag
// to move), the room links on the side jump to the walk's viewpoints
if (q.get("free") === "1") {
  const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
  const controls = new OrbitControls(camera, canvas);
  const ahead = new THREE.Vector3(0, 0, -0.05).applyEuler(camera.rotation).add(camera.position);
  controls.target.copy(ahead);
  controls.rotateSpeed = -0.35; // dragging turns the view, as a walk does
  controls.enableDamping = true;
  controls.update();
  addEventListener("resize", () => {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  const views = JSON.parse(q.get("views") ?? "[]");
  if (views.length) {
    const nav = document.createElement("div");
    nav.style.cssText = "position:fixed;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;font:13px system-ui";
    for (const [name, x, z, yaw] of views) {
      const a = document.createElement("a");
      const u = new URL(location.href);
      u.searchParams.set("at", `${x},${z}`);
      u.searchParams.set("yaw", yaw);
      u.searchParams.set("exposure", exposure.toFixed(3));
      a.href = u.href;
      a.textContent = name;
      a.style.cssText = "background:rgba(255,255,255,.85);padding:3px 8px;border-radius:6px;color:#222;text-decoration:none";
      nav.append(a);
    }
    document.body.append(nav);
  }
  const tag = document.createElement("div");
  tag.textContent = "baked light only (Cycles, 64 samples, denoised) · drag to look · wheel to move";
  tag.style.cssText = "position:fixed;right:10px;bottom:10px;font:12px system-ui;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:6px";
  document.body.append(tag);
}
</script>
</body>
</html>
