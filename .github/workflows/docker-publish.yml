name: Build and publish image

# Every push to main builds ghcr.io/damhau/housegen:sha-<short> (+ latest) and
# rolls it out to the dev environment; a v* tag builds the semver image and
# rolls it out to prod. Rollouts are commits to the GitOps repo (damhau/k8s-argocd),
# from which Argo CD syncs: base/applications/housegen-dev for dev, .../housegen for prod.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The one version string: image tag, GitOps rollout and what the app displays.
      #   v1.2.3 tag → 1.2.3     main → sha-<7 chars> (same as metadata-action's sha tag)
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 → 1.2.3 (prod); every build also gets sha-<7 chars> (what dev deploys);
          # latest only follows main
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Bump the image tag in the GitOps repo; Argo CD rolls it out from there.
  #   main  → base/applications/housegen-dev, tag sha-<short> (immutable, one per commit)
  #   v*    → base/applications/housegen,     tag <semver>
  # A workflow_dispatch from any other branch only publishes an image.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # one GitOps commit at a time: two quick pushes to main must not race on the push
    concurrency:
      group: gitops-housegen
      cancel-in-progress: false
    steps:
      - name: Choose target
        id: target
        run: |
          echo "tag=${{ needs.build.outputs.version }}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app=housegen" >> "$GITHUB_OUTPUT"
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "app=housegen-dev" >> "$GITHUB_OUTPUT"
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: damhau/k8s-argocd
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag
        run: |
          cd base/applications/${{ steps.target.outputs.app }}
          kustomize edit set image ${IMAGE}=${IMAGE}:${{ steps.target.outputs.tag }}

      - name: Commit and push
        run: |
          APP=${{ steps.target.outputs.app }}
          TAG=${{ steps.target.outputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/applications/${APP}/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: deploy ${APP} ${TAG} (${{ steps.target.outputs.env }})"
          # another workflow may have pushed meanwhile: replay on top of it
          git pull --rebase origin main
          git push origin main

      # Argo CD polls the GitOps repo every three minutes; asking it directly makes the rollout
      # start now and turns a rollout that never becomes healthy into a failed workflow. The
      # Argo CD API is only reachable on the tailnet: the runner joins it as tag:ci for the job.
      - name: Connect to the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Refresh, sync and wait in Argo CD
        env:
          ARGOCD_SERVER: argocd.tailb2871.ts.net
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          APP: ${{ steps.target.outputs.app }}
        run: |
          auth="Authorization: Bearer ${ARGOCD_TOKEN}"
          base="https://${ARGOCD_SERVER}/api/v1/applications/${APP}"
          curl -fsS -H "$auth" "${base}?refresh=normal" > /dev/null
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            "${base}/sync" -d '{"prune": true}' > /dev/null
          for i in $(seq 1 60); do
            state=$(curl -fsS -H "$auth" "$base" \
              | jq -r '.status.sync.status + "/" + .status.health.status')
            echo "${APP}: ${state}"
            [[ "$state" == "Synced/Healthy" ]] && exit 0
            sleep 5
          done
          echo "${APP} did not reach Synced/Healthy within 5 minutes"
          exit 1
