name: Deploy to prod

# By hand, from the Actions tab: roll a released version out to prod. The image must already
# exist (a release built by release.yml); it is checked on ghcr.io before anything is touched.
# The rollout itself is deploy.yml against base/applications/housegen.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy, e.g. 0.2.3 (v0.2.3 also works)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Image tag
        id: tag
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a released version (X.Y.Z)"
            exit 1
          fi
          echo "tag=${v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the image exists
        run: |
          image=ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          if ! docker manifest inspect "$image" > /dev/null; then
            echo "::error::${image} does not exist: release that version first (a feat:/fix: push to main)"
            exit 1
          fi

  deploy:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      app: housegen
      env: prod
      tag: ${{ needs.check.outputs.tag }}
    secrets: inherit
